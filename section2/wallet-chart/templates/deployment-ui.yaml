apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-ui
  labels:
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.replicaCount.ui }}
  selector:
    app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.ui.command }}
          command:
            {{- toYaml .Values.ui.command | nindent 12 }}
          {{- end }}
          {{- if .Values.ui.args }}
          args:
            {{- toYaml .Values.ui.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: wallet-config
            - secretRef:
                name: wallet-secret
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}

