apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wallet.fullname" . }}-ui
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.replicaCount.ui }}
  selector:
    matchLabels:
      {{- include "wallet.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wallet.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "ui") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "wallet.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.ui.command }}
          command:
            {{- toYaml .Values.ui.command | nindent 12 }}
          {{- end }}
          {{- if .Values.ui.args }}
          args:
            {{- toYaml .Values.ui.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "wallet.fullname" . }}-config
            - secretRef:
                name: {{ include "wallet.secretName" . }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
