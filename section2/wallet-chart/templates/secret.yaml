{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wallet.secretName" . }}
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
type: Opaque
stringData:
  WALLET_USER: {{ .Values.secrets.WALLET_USER | quote }}
  WALLET_PASS: {{ .Values.secrets.WALLET_PASS | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.S3_ACCESS_KEY | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.S3_SECRET_KEY | quote }}
{{- end }}
