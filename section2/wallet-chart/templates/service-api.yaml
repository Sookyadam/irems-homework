apiVersion: v1
kind: Service
metadata:
  name: wallet-service-api
  labels:
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.api.metricsPort }}
      targetPort: metrics
      protocol: TCP
