apiVersion: v1
kind: Service
metadata:
  name: {{ include "wallet.fullname" . }}-ui
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    {{- include "wallet.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
      protocol: TCP
